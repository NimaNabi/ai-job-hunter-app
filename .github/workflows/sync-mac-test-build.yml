name: Sync test build (macOS, debug)

# Fork-only helper for the #1402 two-device evidence: builds the PR 2b branch
# as a debug macOS app under a separate identifier, so it uses its own data
# folder and never touches an installed AI Job Hunter. Not part of any PR.

on:
  push:
    branches: [ci/sync-mac-test-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-rust
      - name: Build workspace packages
        run: pnpm build:packages
      - name: Build debug app
        run: >-
          pnpm --filter @ajh/desktop tauri build --debug --bundles app
          --config '{"identifier":"com.ajh.tauri.synctest","productName":"AJH Sync Test","bundle":{"createUpdaterArtifacts":false}}'
      - name: Zip the app
        run: |
          cd apps/desktop/src-tauri/target/debug/bundle/macos
          ditto -c -k --keepParent "AJH Sync Test.app" "$GITHUB_WORKSPACE/AJH-Sync-Test-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AJH-Sync-Test-macos
          path: AJH-Sync-Test-macos.zip
          retention-days: 7
